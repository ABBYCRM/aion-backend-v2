name: aion-backend
region: nyc
services:
  - name: api
    github:
      repo: ABBYCRM/aion-backend-v2
      branch: main
      deploy_on_push: true
    source_dir: /
    dockerfile_path: Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    health_check:
      http_path: /healthz
      initial_delay_seconds: 10
      period_seconds: 15
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    envs:
      - key: APP_NAME
        value: AION
        scope: RUN_TIME
        type: GENERAL
      - key: APP_VERSION
        value: 2.1.0
        scope: RUN_TIME
        type: GENERAL
      - key: ENVIRONMENT
        value: production
        scope: RUN_TIME
        type: GENERAL
      - key: RATE_LIMIT_REQUESTS
        value: "60"
        scope: RUN_TIME
        type: GENERAL
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "60"
        scope: RUN_TIME
        type: GENERAL
      - key: MAX_CONCURRENT_CHATS
        value: "4"
        scope: RUN_TIME
        type: GENERAL
      - key: GITHUB_WRITE_ENABLED
        value: "false"
        scope: RUN_TIME
        type: GENERAL
# Required encrypted runtime variables: AION_API_KEYS, AION_ADMIN_KEYS,
# CORS_ORIGINS, exact PRIMARY_PROVIDER/PRIMARY_MODEL (and optional explicit
# provider:model FALLBACK_MODELS), plus provider keys.
#
# To enable durable notes and queryable audit history, attach a PostgreSQL
# database to the App Platform app and set DATABASE_URL to its bindable
# ${database-component.DATABASE_URL}. Local container files are ephemeral.
#
# Optional tools: BRAVE_API_KEY; GitHub App credentials and the mandatory
# GITHUB_ALLOWED_REPOSITORIES allowlist. Writes remain disabled by default.
