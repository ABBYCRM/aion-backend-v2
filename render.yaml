services:
  - type: web
    name: aion-runtime
    runtime: python
    plan: starter
    region: oregon
    healthCheckPath: /healthz
    autoDeploy: true
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    envVars:
      - key: APP_NAME
        value: AION
      - key: APP_VERSION
        value: 1.1.0
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: '*'
      - key: LOG_LEVEL
        value: info
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENROUTER_APP_NAME
        value: AION-Runtime
      - key: OPENROUTER_APP_URL
        value: https://aion.local
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: BITDEER_API_KEY
        sync: false
      - key: BITDEER_BASE_URL
        value: https://api-inference.bitdeer.ai/v1
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: PRIMARY_MODEL
        value: moonshotai/kimi-k3
      - key: FALLBACK_MODELS
        value: nvidia/nemotron-3-super-120b-a12b,x-ai/grok-4.5,qwen/qwen3.8-max,deepseek/deepseek-v4-pro,anthropic/claude-sonnet-5
      - key: REQUEST_TIMEOUT_SECONDS
        value: 60
      - key: MAX_CONTEXT_MESSAGES
        value: 40
      - key: AUDIT_LOG_DIR
        value: /var/data/audit
    disk:
      name: aion-audit-disk
      mountPath: /var/data
      sizeGB: 1
